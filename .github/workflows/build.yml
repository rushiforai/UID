name: Build module ZIP

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release under this tag (e.g. v0.2.3). Leave empty to only build.'
        required: false
        type: string

permissions:
  contents: read

env:
  NDK_VERSION: 27.3.13750724

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Build ${{ matrix.variant }} module
        run: >
          python tools/uid-seccomp-module/build.py
          --variant ${{ matrix.variant }}
          --output build/${{ matrix.variant }}

      - name: Verify the ZIP and its checksum
        run: |
          set -euo pipefail
          dir="build/${{ matrix.variant }}"
          zip="$(ls "$dir"/*.zip)"
          unzip -l "$zip"
          unzip -p "$zip" module.prop
          ( cd "$dir" && sha256sum -c "$(basename "$zip").sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: cq-uid-seccomp-${{ matrix.variant }}
          path: |
            build/${{ matrix.variant }}/*.zip
            build/${{ matrix.variant }}/*.sha256
            build/${{ matrix.variant }}/artifacts.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG}"
          fi
          [ -n "$tag" ] || { echo 'No release tag resolved' >&2; exit 1; }
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: List release files
        run: find dist -type f -print

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: UID Filter ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.zip.sha256
